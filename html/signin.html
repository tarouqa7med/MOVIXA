<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="./../css/signin.css">
        <title>Sign In Page</title>
</head>
<body>
        <div class="signindiv p-4 rounded-4 text-center">
                <h2 class="mb-5">Sign <span class="signin">In</span></h2>
                <form class="mb-4 m-auto" action="">
                        <div class="form-control bg-transparent border-0 mb-2">
                                <input class="rounded-3 px-3" type="text" name="username" placeholder="UserName">
                        </div>
                        <div class="form-control bg-transparent border-0 mb-2">
                                <input class="rounded-3 px-3" type="password" name="password" placeholder="Passcode">
                        </div>
                        <div class="form-control bg-transparent border-0 mb-2 d-flex justify-content-start lign-items-center">
                                <input class="rounded-3 me-2" type="checkbox" id="remember">
                                <label for="remember">Remember Me</label>
                        </div>
                        <div class="form-control bg-transparent border-0 mb-2">
                                <button class="signinBtn w-100 rounded-3 border-0 text-white">SIGN IN</button>
                        </div>
                </form>
                <p>Don't have an account? <a href="./signup.html">Sign Up</a></p>
                <a href="./forgotPassword.html">Forgot password?</a>
        </div>
</body>
</html>
