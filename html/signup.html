<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="./../css/signin.css">
        <title>Sign Up Page</title>
</head>

<body>
        <div class="signindiv p-4 rounded-4 text-center">
                <h2 class="mb-3">Sign <span class="signin">Up</span></h2>
                <form class="mb-4 m-auto" action="">
                        <div class="form-control bg-transparent border-0 mb-2">
                                <input class="rounded-3 px-3" type="text" name="name" placeholder="Name">
                        </div>
                        <div class="form-control bg-transparent border-0 mb-2">
                                <input class="rounded-3 px-3" type="email" name="email" placeholder="Email">
                        </div>
                        <div class="form-control bg-transparent border-0 mb-2">
                                <input class="rounded-3 px-3" type="password" name="password" placeholder="Passcode">
                        </div>
                        <div class="form-control bg-transparent border-0 mb-2 d-flex justify-content-start lign-items-center">
                                <input class="rounded-3 me-2" type="checkbox" id="policy">
                                <label for="policy">I agree to the <a href="./privacy.html">Privacy Policy</a></label>
                        </div>
                        <div class="form-control bg-transparent border-0 mb-2">
                                <button class="signinBtn w-100 rounded-3 border-0 text-white">SIGN IN</button>
                        </div>
                </form>
                <p>Already have an account? <a href="./signin.html">Sign in!</a></p>
        </div>
</body>

</html>
